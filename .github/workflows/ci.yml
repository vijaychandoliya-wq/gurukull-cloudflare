name: Cloudflare workspace CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cloudflare-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/portal/source ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Validate Worker bundle
        working-directory: workers/api
        run: npx wrangler deploy --dry-run --env staging --outdir /tmp/gurukul-api-dry-run

