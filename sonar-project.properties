sonar.projectKey=gurukull-cloudflare
sonar.projectName=Gurukull Cloudflare
sonar.sources=workers/api/src,workers/jobs/src,packages,apps/portal/source/src
sonar.tests=workers/api/test,workers/jobs/test,packages,apps/portal/source/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/.wrangler/**,**/dist/**,**/coverage/**,migrations/**,tools/**,**/*.d.ts
sonar.coverage.exclusions=**/*.d.ts,**/index.ts,**/storage/**
sonar.typescript.tsconfigPaths=tsconfig.json,apps/portal/source/tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
