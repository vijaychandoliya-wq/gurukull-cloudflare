sonar.projectKey=gurukull-cloudflare
sonar.projectName=Gurukull Cloudflare
sonar.sources=workers/api/src,workers/jobs/src,packages
sonar.tests=workers/api/test,workers/jobs/test
sonar.test.inclusions=workers/api/test/**/*.spec.ts,workers/jobs/test/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/.wrangler/**,**/dist/**,**/coverage/**,migrations/**,tools/**,**/*.d.ts
sonar.coverage.exclusions=**/*.d.ts,**/index.ts,**/storage/**
sonar.typescript.tsconfigPaths=tsconfig.json,workers/api/tsconfig.json,workers/jobs/tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
